name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |
          flutter create --org com.example --project-name hdr_player --platforms=android build_app
          rm -rf build_app/lib build_app/test
          cp -r lib test pubspec.yaml build_app/
          mkdir -p build_app/android/app/src/main/kotlin/com/example/hdr_player
          cp native/*.kt build_app/android/app/src/main/kotlin/com/example/hdr_player/
          python3 - <<'PY'
          p = 'build_app/android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ''.join('<uses-permission android:name="android.permission.%s"/>' % n for n in
                          ['WAKE_LOCK', 'POST_NOTIFICATIONS', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_MEDIA_PLAYBACK'])
          s = s.replace('<application', perms + '<application', 1)
          s = s.replace('</application>', '<service android:name=".PlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback"/></application>', 1)
          open(p, 'w').write(s)
          PY
          grep -n "PlaybackService\|FOREGROUND" build_app/android/app/src/main/AndroidManifest.xml
          # MediaFormat color keys + HDR static info need API 24
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' build_app/android/app/build.gradle*
          grep -n "minSdk" build_app/android/app/build.gradle*

      - name: Test
        working-directory: build_app
        run: |
          flutter pub get
          flutter test

      - name: Build APK
        working-directory: build_app
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --no-shrink 2>&1 | tee build.log || {
            { grep -E '^e: ' build.log | head -15; sed -n '/What went wrong/,/Try:/p' build.log | head -12; } | cut -c1-320 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: hdr-player-apk
          path: build_app/build/app/outputs/flutter-apk/*-release.apk
